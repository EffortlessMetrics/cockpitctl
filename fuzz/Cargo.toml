[package]
name = "cockpitctl-fuzz"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Fuzzing harness for cockpitctl parsing and conformance inputs."
readme = "README.md"
keywords = ["fuzzing", "security", "ci", "receipts", "parser"]
categories = ["development-tools"]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.10"
serde_json = "1.0.149"
toml = "0.9.8"
cockpitctl-types = { path = "../crates/cockpitctl-types" }
cockpitctl-domain = { path = "../crates/cockpitctl-domain" }
cockpitctl-sarif = { path = "../crates/cockpitctl-sarif" }
cockpitctl-render = { path = "../crates/cockpitctl-render" }
cockpitctl-conform = { path = "../crates/cockpitctl-conform" }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "parse_receipt"
path = "fuzz_targets/parse_receipt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_config"
path = "fuzz_targets/parse_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sarif_convert"
path = "fuzz_targets/sarif_convert.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_comment"
path = "fuzz_targets/render_comment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_sensor_id"
path = "fuzz_targets/fuzz_sensor_id.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_schema_validate"
path = "fuzz_targets/fuzz_schema_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_domain_pipeline"
path = "fuzz_targets/fuzz_domain_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_render_annotations"
path = "fuzz_targets/fuzz_render_annotations.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_fingerprint"
path = "fuzz_targets/fuzz_fingerprint.rs"
test = false
doc = false
bench = false
