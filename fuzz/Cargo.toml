[package]
name = "cockpitctl-fuzz"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Fuzzing harness for cockpitctl parsing and conformance inputs."
readme = "README.md"
keywords = ["fuzzing", "security", "ci", "receipts", "parser"]
categories = ["development-tools"]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.10"
serde_json = "1.0.149"
toml = "0.9.8"
cockpitctl-types = { path = "../crates/cockpitctl-types" }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "parse_receipt"
path = "fuzz_targets/parse_receipt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_config"
path = "fuzz_targets/parse_config.rs"
test = false
doc = false
bench = false
