name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Run doc tests
        run: cargo test --workspace --doc

      - name: Compile benchmarks
        run: cargo bench --workspace --no-run

      - name: Compile examples
        run: cargo build --workspace --examples

      - name: Build without default features
        run: cargo build -p cockpitctl --no-default-features

      - name: Test without default features
        run: cargo test -p cockpitctl --no-default-features

      - name: Schema sync check
        run: cargo run -p xtask -- schema-sync-check

      - name: Example sync check
        run: cargo run -p xtask -- example-sync-check

      - name: Install ripr
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: cargo install ripr --locked

      - name: Fetch base branch for RIPR
        if: github.event_name == 'pull_request' && github.base_ref != ''
        continue-on-error: true
        run: git fetch origin ${{ github.base_ref }}

      - name: RIPR PR evidence
        if: github.event_name == 'pull_request'
        id: ripr_pr
        continue-on-error: true
        run: cargo xtask ripr-pr

      - name: RIPR review guidance
        if: github.event_name == 'pull_request'
        id: ripr_review
        continue-on-error: true
        run: cargo xtask ripr-review-comments

      - name: RIPR PR contract
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        run: cargo xtask ripr-pr --check

      - name: RIPR review summary
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          {
            echo "## RIPR Review Guidance"
            echo
            if [ -f target/ripr/review/comments.md ]; then
              cat target/ripr/review/comments.md
            else
              echo "No RIPR review guidance was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: RIPR annotations
        if: always() && github.event_name == 'pull_request'
        run: python scripts/ripr-annotations.py

      - name: Upload RIPR PR evidence
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ripr-pr
          path: target/ripr/pr
          if-no-files-found: warn

      - name: Upload RIPR review guidance
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ripr-review
          path: target/ripr/review
          if-no-files-found: warn

      - name: Package list (all publishable crates)
        run: |
          cargo package --list \
            -p cockpitctl-types \
            -p cockpitctl-feature-state \
            -p cockpitctl-feature-grid \
            -p cockpitctl-domain-buildfix \
            -p cockpitctl-domain-signing \
            -p cockpitctl-domain-trend \
            -p cockpitctl-domain \
            -p cockpitctl-ingest \
            -p cockpitctl-render \
            -p cockpitctl-io-schema \
            -p cockpitctl-io-buildfix \
            -p cockpitctl-io-hooks \
            -p cockpitctl-io-policy-signing \
            -p cockpitctl-io \
            -p cockpitctl-sarif \
            -p cockpitctl-core \
            -p cockpitctl-conform \
            -p conformctl \
            -p cockpitctl \
            --registry crates-io

      - name: Package (all publishable crates, no-verify)
        run: |
          echo "Packaging crates as a set"
          cargo package \
            -p cockpitctl-types \
            -p cockpitctl-feature-state \
            -p cockpitctl-feature-grid \
            -p cockpitctl-domain-buildfix \
            -p cockpitctl-domain-signing \
            -p cockpitctl-domain-trend \
            -p cockpitctl-domain \
            -p cockpitctl-ingest \
            -p cockpitctl-render \
            -p cockpitctl-io-schema \
            -p cockpitctl-io-buildfix \
            -p cockpitctl-io-hooks \
            -p cockpitctl-io-policy-signing \
            -p cockpitctl-io \
            -p cockpitctl-sarif \
            -p cockpitctl-core \
            -p cockpitctl-conform \
            -p conformctl \
            -p cockpitctl \
            --no-verify --registry crates-io

      - name: Verify package contents (no junk shipped)
        run: |
          FAIL=0
          JUNK_PATTERN='(fixtures/|docs/|\.snap$|\.snap\.new$|target/|\.github/|tests/)'
          for crate in cockpitctl-types cockpitctl-core cockpitctl conformctl; do
            echo "=== Checking $crate ==="
            FILES=$(cargo package --list -p "$crate" --allow-dirty 2>&1)
            if echo "$FILES" | grep -qE "$JUNK_PATTERN"; then
              echo "FAIL: $crate ships unexpected files:"
              echo "$FILES" | grep -E "$JUNK_PATTERN"
              FAIL=1
            else
              echo "  OK: $crate — no junk files"
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "FAILED: package content hygiene check"
            exit 1
          fi

      - name: Verify embedded schemas in cockpitctl-types package
        run: |
          FILES=$(cargo package --list -p cockpitctl-types --allow-dirty)
          for schema in sensor.report.v1.json cockpit.report.v1.json buildfix.plan.v1.json cockpit.promote.v1.json; do
            if echo "$FILES" | grep -q "$schema"; then
              echo "  OK: $schema included"
            else
              echo "FAIL: $schema missing from cockpitctl-types package"
              exit 1
            fi
          done

      - name: Publish dry-run (types only, safe pre-first-publish)
        run: cargo publish --dry-run -p cockpitctl-types

      - name: Ensure cockpitctl-core has no CLI dependencies
        run: |
          if cargo tree -p cockpitctl-core -e normal --prefix none | grep -Eq '^[[:space:]]*(clap|clap_derive|clap_builder)([[:space:]]|$)'; then
            echo "FAIL: clap leaked into cockpitctl-core normal dependencies"
            cargo tree -p cockpitctl-core -e normal
            exit 1
          fi

      - name: Ensure conformctl has no cockpitctl-core/domain/ingest/render/io dependencies
        run: |
          for crate in cockpitctl-core cockpitctl-domain cockpitctl-ingest cockpitctl-render cockpitctl-io; do
            if cargo tree -p conformctl -e normal --prefix none | grep -Eq "^[[:space:]]*${crate}([[:space:]]|$)"; then
              echo "FAIL: ${crate} leaked into conformctl normal dependencies"
              cargo tree -p conformctl -e normal
              exit 1
            fi
          done

      - name: Conformance (happy_path)
        run: |
          export COCKPITCTL_STARTED_AT="2026-02-02T12:00:00Z"
          cargo run -p cockpitctl -- ingest --artifacts fixtures/happy_path/artifacts --config fixtures/happy_path/cockpit.toml
          cargo run -p xtask -- conform-dir --dir fixtures/happy_path/artifacts --all --validate-cockpit

      - name: Conformance (reference_sensor)
        run: |
          export COCKPITCTL_STARTED_AT="2026-02-02T12:00:00Z"
          cargo run -p cockpitctl -- ingest --artifacts fixtures/reference_sensor/artifacts --config fixtures/reference_sensor/cockpit.toml
          cargo run -p xtask -- conform-dir --dir fixtures/reference_sensor/artifacts --all --validate-cockpit

      # Optional: mutation tests (expensive)
      # - name: Mutation tests
      #   run: cargo install cargo-mutants && cargo mutants --workspace

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: cargo audit

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read MSRV from rust-toolchain.toml
        id: msrv
        run: |
          MSRV=$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build with MSRV
        run: cargo build --workspace --all-targets

      - name: Test with MSRV
        run: cargo test --workspace --all-targets

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
