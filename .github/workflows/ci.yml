name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Schema sync check
        run: cargo run -p xtask -- schema-sync-check

      - name: Package List (cockpitctl)
        run: cargo package --list -p cockpitctl

      - name: Package List (cockpitctl-types)
        run: cargo package --list -p cockpitctl-types

      - name: Publish dry-run (cockpitctl-types)
        run: cargo publish --dry-run -p cockpitctl-types

      - name: Package List (cockpitctl-core)
        run: cargo package --list -p cockpitctl-core

      - name: Package List (cockpitctl-conform)
        run: cargo package --list -p cockpitctl-conform

      - name: Package List (conformctl)
        run: cargo package --list -p conformctl

      - name: Ensure cockpitctl-core has no CLI dependencies
        run: |
          if cargo tree -p cockpitctl-core -e normal --prefix none | grep -Eq '^[[:space:]]*(clap|clap_derive|clap_builder)([[:space:]]|$)'; then
            echo "FAIL: clap leaked into cockpitctl-core normal dependencies"
            cargo tree -p cockpitctl-core -e normal
            exit 1
          fi

      - name: Ensure conformctl has no cockpitctl-core/domain/ingest/render/io dependencies
        run: |
          for crate in cockpitctl-core cockpitctl-domain cockpitctl-ingest cockpitctl-render cockpitctl-io; do
            if cargo tree -p conformctl -e normal --prefix none | grep -Eq "^[[:space:]]*${crate}([[:space:]]|$)"; then
              echo "FAIL: ${crate} leaked into conformctl normal dependencies"
              cargo tree -p conformctl -e normal
              exit 1
            fi
          done

      - name: Conformance (happy_path)
        run: |
          export COCKPITCTL_STARTED_AT="2026-02-02T12:00:00Z"
          cargo run -p cockpitctl -- ingest --artifacts fixtures/happy_path/artifacts --config fixtures/happy_path/cockpit.toml
          cargo run -p xtask -- conform-dir --dir fixtures/happy_path/artifacts --all --validate-cockpit

      - name: Conformance (reference_sensor)
        run: |
          export COCKPITCTL_STARTED_AT="2026-02-02T12:00:00Z"
          cargo run -p cockpitctl -- ingest --artifacts fixtures/reference_sensor/artifacts --config fixtures/reference_sensor/cockpit.toml
          cargo run -p xtask -- conform-dir --dir fixtures/reference_sensor/artifacts --all --validate-cockpit

      # Optional: mutation tests (expensive)
      # - name: Mutation tests
      #   run: cargo install cargo-mutants && cargo mutants --workspace
