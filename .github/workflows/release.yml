name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gate:
    name: Quality Gate (fmt & clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify version tag matches Cargo.toml
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cockpitctl") | .version')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Dry-run publish cockpitctl-types
        run: cargo publish --dry-run -p cockpitctl-types --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish cockpitctl-types
        run: cargo publish -p cockpitctl-types --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Dry-run publish cockpitctl-conform
        run: cargo publish --dry-run -p cockpitctl-conform --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish cockpitctl-conform
        run: cargo publish -p cockpitctl-conform --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Dry-run publish cockpitctl-domain
        run: cargo publish --dry-run -p cockpitctl-domain --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish cockpitctl-domain
        run: cargo publish -p cockpitctl-domain --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Dry-run publish cockpitctl-render
        run: cargo publish --dry-run -p cockpitctl-render --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish cockpitctl-render
        run: cargo publish -p cockpitctl-render --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Dry-run publish cockpitctl-ingest
        run: cargo publish --dry-run -p cockpitctl-ingest --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish cockpitctl-ingest
        run: cargo publish -p cockpitctl-ingest --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Dry-run publish cockpitctl-io
        run: cargo publish --dry-run -p cockpitctl-io --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish cockpitctl-io
        run: cargo publish -p cockpitctl-io --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Dry-run publish cockpitctl-sarif
        run: cargo publish --dry-run -p cockpitctl-sarif --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish cockpitctl-sarif
        run: cargo publish -p cockpitctl-sarif --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Dry-run publish cockpitctl-core
        run: cargo publish --dry-run -p cockpitctl-core --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish cockpitctl-core
        run: cargo publish -p cockpitctl-core --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Dry-run publish cockpitctl
        run: cargo publish --dry-run -p cockpitctl --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish cockpitctl
        run: cargo publish -p cockpitctl --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Dry-run publish conformctl
        run: cargo publish --dry-run -p conformctl --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish conformctl
        run: cargo publish -p conformctl --token ${{ secrets.CRATES_IO_TOKEN }}

  build-binaries:
    name: Build ${{ matrix.package }} ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # cockpitctl binaries
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: cockpitctl
            binary_name: cockpitctl
            asset_name: cockpitctl-linux-x64
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            package: cockpitctl
            binary_name: cockpitctl
            asset_name: cockpitctl-darwin-x64
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            package: cockpitctl
            binary_name: cockpitctl
            asset_name: cockpitctl-darwin-arm64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            package: cockpitctl
            binary_name: cockpitctl.exe
            asset_name: cockpitctl-windows-x64.exe
          # conformctl binaries
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: conformctl
            binary_name: conformctl
            asset_name: conformctl-linux-x64
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            package: conformctl
            binary_name: conformctl
            asset_name: conformctl-darwin-x64
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            package: conformctl
            binary_name: conformctl
            asset_name: conformctl-darwin-arm64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            package: conformctl
            binary_name: conformctl.exe
            asset_name: conformctl-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p ${{ matrix.package }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          copy target\${{ matrix.target }}\release\${{ matrix.binary_name }} ${{ matrix.asset_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  test-binaries:
    name: Test ${{ matrix.package }} ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: build-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          # cockpitctl test matrix
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: cockpitctl
            binary_name: cockpitctl
            asset_name: cockpitctl-linux-x64
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            package: cockpitctl
            binary_name: cockpitctl
            asset_name: cockpitctl-darwin-x64
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            package: cockpitctl
            binary_name: cockpitctl
            asset_name: cockpitctl-darwin-arm64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            package: cockpitctl
            binary_name: cockpitctl.exe
            asset_name: cockpitctl-windows-x64.exe
          # conformctl test matrix
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: conformctl
            binary_name: conformctl
            asset_name: conformctl-linux-x64
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            package: conformctl
            binary_name: conformctl
            asset_name: conformctl-darwin-x64
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            package: conformctl
            binary_name: conformctl
            asset_name: conformctl-darwin-arm64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            package: conformctl
            binary_name: conformctl.exe
            asset_name: conformctl-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ./

      - name: Make binary executable (Unix)
        if: matrix.os != 'windows-latest'
        run: chmod +x ${{ matrix.asset_name }}

      - name: Test ${{ matrix.package }} --version
        shell: bash
        run: ./${{ matrix.asset_name }} --version

      - name: Test cockpitctl ingest command
        if: matrix.package == 'cockpitctl'
        shell: bash
        run: |
          ./${{ matrix.asset_name }} ingest --artifacts fixtures/happy_path/artifacts --config fixtures/happy_path/cockpit.toml

      - name: Test conformctl check command
        if: matrix.package == 'conformctl'
        shell: bash
        run: |
          ./${{ matrix.asset_name }} check --report fixtures/happy_path/artifacts/builddiag/report.json --sensor-id builddiag

  github-release:
    name: Create GitHub Release
    needs: [publish, test-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec mv {} release-assets/ \;
          ls -la release-assets/

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          tmp="$(mktemp)"
          for f in $(ls -1 | sort); do
            sha256sum "$f" >> "$tmp"
          done
          mv "$tmp" SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: release-assets/*
