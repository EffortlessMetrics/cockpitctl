name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gate:
    name: Quality Gate (fmt & clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: quality-gate
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify crates.io token is configured
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is missing. Configure it in repository or organization settings before tagging a release."
            exit 1
          fi

      - name: Verify version tag matches Cargo.toml
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cockpitctl") | .version')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Run tests
        run: cargo test --workspace --all-targets

      # ── Tier 1: leaf crates (no workspace deps) ──
      # cockpitctl-types: stable DTOs, embedded schemas, ordering helpers
      # cockpitctl-feature-state: feature flag state types
      - name: Dry-run publish cockpitctl-types
        run: cargo publish --dry-run -p cockpitctl-types
      - name: Publish cockpitctl-types
        run: cargo publish -p cockpitctl-types
      - name: Dry-run publish cockpitctl-feature-state
        run: cargo publish --dry-run -p cockpitctl-feature-state
      - name: Publish cockpitctl-feature-state
        run: cargo publish -p cockpitctl-feature-state
      - name: Wait for crates.io index update (tier 1)
        run: sleep 30

      # ── Tier 2: depends on types and/or feature-state (5 crates) ──
      # cockpitctl-conform: conformance checking (schema validation, path hygiene)
      # cockpitctl-domain-{buildfix,signing,trend}: domain sub-modules
      # cockpitctl-feature-grid: feature grid composition
      - name: Dry-run publish cockpitctl-conform
        run: cargo publish --dry-run -p cockpitctl-conform
      - name: Publish cockpitctl-conform
        run: cargo publish -p cockpitctl-conform
      - name: Dry-run publish cockpitctl-domain-buildfix
        run: cargo publish --dry-run -p cockpitctl-domain-buildfix
      - name: Publish cockpitctl-domain-buildfix
        run: cargo publish -p cockpitctl-domain-buildfix
      - name: Dry-run publish cockpitctl-domain-signing
        run: cargo publish --dry-run -p cockpitctl-domain-signing
      - name: Publish cockpitctl-domain-signing
        run: cargo publish -p cockpitctl-domain-signing
      - name: Dry-run publish cockpitctl-domain-trend
        run: cargo publish --dry-run -p cockpitctl-domain-trend
      - name: Publish cockpitctl-domain-trend
        run: cargo publish -p cockpitctl-domain-trend
      - name: Dry-run publish cockpitctl-feature-grid
        run: cargo publish --dry-run -p cockpitctl-feature-grid
      - name: Publish cockpitctl-feature-grid
        run: cargo publish -p cockpitctl-feature-grid
      - name: Wait for crates.io index update (tier 2)
        run: sleep 30

      # ── Tier 3: depends on tier-2 crates (3 crates) ──
      # cockpitctl-domain: policy evaluation, deterministic selection, normalization
      # cockpitctl-io-buildfix: buildfix actuator adapter (depends on types)
      # cockpitctl-io-policy-signing: policy signing key loader (depends on types)
      - name: Dry-run publish cockpitctl-domain
        run: cargo publish --dry-run -p cockpitctl-domain
      - name: Publish cockpitctl-domain
        run: cargo publish -p cockpitctl-domain
      - name: Dry-run publish cockpitctl-io-buildfix
        run: cargo publish --dry-run -p cockpitctl-io-buildfix
      - name: Publish cockpitctl-io-buildfix
        run: cargo publish -p cockpitctl-io-buildfix
      - name: Dry-run publish cockpitctl-io-policy-signing
        run: cargo publish --dry-run -p cockpitctl-io-policy-signing
      - name: Publish cockpitctl-io-policy-signing
        run: cargo publish -p cockpitctl-io-policy-signing
      - name: Wait for crates.io index update (tier 3)
        run: sleep 30

      # ── Tier 4: render & ingest (2 crates) ──
      # cockpitctl-render: PR comment renderer with budgeting and stable markers
      # cockpitctl-ingest: use-case orchestration with ports (ReceiptSource, PolicySource, OutputSink)
      - name: Dry-run publish cockpitctl-render
        run: cargo publish --dry-run -p cockpitctl-render
      - name: Publish cockpitctl-render
        run: cargo publish -p cockpitctl-render
      - name: Dry-run publish cockpitctl-ingest
        run: cargo publish --dry-run -p cockpitctl-ingest
      - name: Publish cockpitctl-ingest
        run: cargo publish -p cockpitctl-ingest
      - name: Wait for crates.io index update (tier 4)
        run: sleep 30

      # ── Tier 5: IO adapters depending on ingest ports (2 crates) ──
      # cockpitctl-io-hooks: post-processor hook runner (depends on ingest + types)
      # cockpitctl-io-schema: schema validation adapter (depends on ingest + types)
      - name: Dry-run publish cockpitctl-io-hooks
        run: cargo publish --dry-run -p cockpitctl-io-hooks
      - name: Publish cockpitctl-io-hooks
        run: cargo publish -p cockpitctl-io-hooks
      - name: Dry-run publish cockpitctl-io-schema
        run: cargo publish --dry-run -p cockpitctl-io-schema
      - name: Publish cockpitctl-io-schema
        run: cargo publish -p cockpitctl-io-schema
      - name: Wait for crates.io index update (tier 5)
        run: sleep 30

      # ── Tier 6: io + sarif (2 crates) ──
      # cockpitctl-io: filesystem adapters implementing ingest ports
      # cockpitctl-sarif: SARIF format conversion
      - name: Dry-run publish cockpitctl-io
        run: cargo publish --dry-run -p cockpitctl-io
      - name: Publish cockpitctl-io
        run: cargo publish -p cockpitctl-io
      - name: Dry-run publish cockpitctl-sarif
        run: cargo publish --dry-run -p cockpitctl-sarif
      - name: Publish cockpitctl-sarif
        run: cargo publish -p cockpitctl-sarif
      - name: Wait for crates.io index update (tier 6)
        run: sleep 30

      # ── Tier 7: core facade (1 crate) ──
      # cockpitctl-core: re-exports all microcrates as a single dependency
      - name: Dry-run publish cockpitctl-core
        run: cargo publish --dry-run -p cockpitctl-core
      - name: Publish cockpitctl-core
        run: cargo publish -p cockpitctl-core
      - name: Wait for crates.io index update (tier 7)
        run: sleep 30

      # ── Tier 8: CLI binary (1 crate) ──
      # cockpitctl: clap-based binary entry point
      - name: Dry-run publish cockpitctl
        run: cargo publish --dry-run -p cockpitctl
      - name: Publish cockpitctl
        run: cargo publish -p cockpitctl
      - name: Wait for crates.io index update (tier 8)
        run: sleep 30

      # ── Tier 9: conformctl binary (1 crate) ──
      # conformctl: standalone conformance checker (depends only on types + conform)
      - name: Dry-run publish conformctl
        run: cargo publish --dry-run -p conformctl
      - name: Publish conformctl
        run: cargo publish -p conformctl
  build-binaries:
    name: Build ${{ matrix.package }} ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # cockpitctl binaries
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: cockpitctl
            binary_name: cockpitctl
            asset_name: cockpitctl-linux-x64
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            package: cockpitctl
            binary_name: cockpitctl
            asset_name: cockpitctl-darwin-x64
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            package: cockpitctl
            binary_name: cockpitctl
            asset_name: cockpitctl-darwin-arm64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            package: cockpitctl
            binary_name: cockpitctl.exe
            asset_name: cockpitctl-windows-x64.exe
          # conformctl binaries
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: conformctl
            binary_name: conformctl
            asset_name: conformctl-linux-x64
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            package: conformctl
            binary_name: conformctl
            asset_name: conformctl-darwin-x64
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            package: conformctl
            binary_name: conformctl
            asset_name: conformctl-darwin-arm64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            package: conformctl
            binary_name: conformctl.exe
            asset_name: conformctl-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p ${{ matrix.package }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          copy target\${{ matrix.target }}\release\${{ matrix.binary_name }} ${{ matrix.asset_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  test-binaries:
    name: Test ${{ matrix.package }} ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: build-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          # cockpitctl test matrix
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: cockpitctl
            binary_name: cockpitctl
            asset_name: cockpitctl-linux-x64
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            package: cockpitctl
            binary_name: cockpitctl
            asset_name: cockpitctl-darwin-x64
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            package: cockpitctl
            binary_name: cockpitctl
            asset_name: cockpitctl-darwin-arm64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            package: cockpitctl
            binary_name: cockpitctl.exe
            asset_name: cockpitctl-windows-x64.exe
          # conformctl test matrix
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: conformctl
            binary_name: conformctl
            asset_name: conformctl-linux-x64
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            package: conformctl
            binary_name: conformctl
            asset_name: conformctl-darwin-x64
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            package: conformctl
            binary_name: conformctl
            asset_name: conformctl-darwin-arm64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            package: conformctl
            binary_name: conformctl.exe
            asset_name: conformctl-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ./

      - name: Make binary executable (Unix)
        if: matrix.os != 'windows-latest'
        run: chmod +x ${{ matrix.asset_name }}

      - name: Test ${{ matrix.package }} --version
        shell: bash
        run: ./${{ matrix.asset_name }} --version

      - name: Test cockpitctl ingest command
        if: matrix.package == 'cockpitctl'
        shell: bash
        run: |
          ./${{ matrix.asset_name }} ingest --artifacts fixtures/happy_path/artifacts --config fixtures/happy_path/cockpit.toml

      - name: Test conformctl check command
        if: matrix.package == 'conformctl'
        shell: bash
        run: |
          ./${{ matrix.asset_name }} check --report fixtures/happy_path/artifacts/builddiag/report.json --sensor-id builddiag

  github-release:
    name: Create GitHub Release
    needs: [publish, test-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec mv {} release-assets/ \;
          ls -la release-assets/

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          tmp="$(mktemp)"
          for f in $(ls -1 | sort); do
            sha256sum "$f" >> "$tmp"
          done
          mv "$tmp" SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: release-assets/*
