[policy]
warn_is_fail = false
max_highlights = 7
max_per_sensor_findings = 20
max_annotations = 25
section_order = ["Highlights", "Build", "Coverage", "Other"]

[sensors.builddiag]
blocking = true
missing = "fail"
section = "Build"
repro = "builddiag check"

[sensors.coverage]
blocking = true
missing = "fail"
section = "Coverage"
repro = "coverage run"
