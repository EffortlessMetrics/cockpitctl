[policy]
warn_is_fail = false
max_highlights = 7
max_per_sensor_findings = 20
max_annotations = 25
section_order = ["Highlights", "Quality", "Other"]

[sensors.coverage]
blocking = false
missing = "skip"
section = "Quality"
repro = "coverage run"

[sensors.perftest]
blocking = false
missing = "skip"
section = "Quality"
repro = "perftest bench"
