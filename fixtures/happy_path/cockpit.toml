[policy]
warn_is_fail = false
max_highlights = 7
max_per_sensor_findings = 20
max_annotations = 25
section_order = ["Highlights", "Repo contract", "Policy", "Other"]

[sensors.builddiag]
blocking = true
missing = "fail"
section = "Repo contract"
repro = "builddiag check --profile team"

[sensors.diffguard]
blocking = true
missing = "fail"
section = "Policy"
repro = "diffguard check --base $BASE_SHA --head $HEAD_SHA"
