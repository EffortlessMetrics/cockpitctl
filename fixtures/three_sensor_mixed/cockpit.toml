[policy]
warn_is_fail = false
max_highlights = 7
max_per_sensor_findings = 20
max_annotations = 25
section_order = ["Highlights", "Build", "Style", "Security", "Other"]

[sensors.builddiag]
blocking = true
missing = "fail"
section = "Build"
repro = "builddiag check"

[sensors.stylechecker]
blocking = false
missing = "skip"
section = "Style"
repro = "stylechecker lint"

[sensors.secaudit]
blocking = true
missing = "fail"
section = "Security"
repro = "secaudit scan"
