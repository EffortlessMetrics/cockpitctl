[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Workspace task runner for schema sync, conformance checks, and fixture tooling."
readme = "README.md"
authors.workspace = true
keywords = ["ci", "tooling", "schemas", "conformance", "fixtures"]
categories = ["development-tools"]

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
cockpitctl-conform = { path = "../crates/cockpitctl-conform" }
cockpitctl-types = { path = "../crates/cockpitctl-types" }
jsonschema.workspace = true
serde_json.workspace = true
tempfile.workspace = true
walkdir.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
