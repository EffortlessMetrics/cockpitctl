[workspace]
resolver = "2"
members = [
  "crates/cockpitctl-types",
  "crates/cockpitctl-domain",
  "crates/cockpitctl-ingest",
  "crates/cockpitctl-render",
  "crates/cockpitctl-io",
  "crates/cockpitctl-sarif",
  "crates/cockpitctl-core",
  "crates/cockpitctl-cli",
  "crates/cockpitctl-conform",
  "crates/conformctl",
  "xtask",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/EffortlessMetrics/cockpitctl"
homepage = "https://github.com/EffortlessMetrics/cockpitctl"
authors = ["Effortless Metrics"]
readme = "README.md"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.dependencies]
anyhow = "1.0.101"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"
clap = { version = "4.5.58", features = ["derive"] }
sha2 = "0.10.9"
hex = "0.4.3"
walkdir = "2.5.0"
time = { version = "0.3.47", features = ["formatting"] }
globset = "0.4.18"
tempfile = "3.25.0"
jsonschema = "0.42.0"

# Dev/test dependencies (centralized; crates opt in)
pretty_assertions = "1.4.1"
assert_cmd = "2.1.2"
predicates = "3.1.4"
proptest = "1.10.0"
insta = { version = "1.46.3", features = ["json"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.0"
cucumber = "0.22.1"
futures = "0.3.31"
