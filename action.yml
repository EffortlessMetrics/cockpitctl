name: 'cockpitctl'
description: 'Aggregate sensor receipts and produce a merge decision surface'
author: 'cockpitctl'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  artifacts-path:
    description: 'Path to the artifacts directory containing sensor receipts'
    required: false
    default: 'artifacts'
  config-path:
    description: 'Path to the cockpit.toml configuration file'
    required: false
    default: 'cockpit.toml'
  labels:
    description: 'Comma-separated list of PR labels to pass to cockpitctl (for label-gated sensors)'
    required: false
    default: ''
  version:
    description: 'Version of cockpitctl to install (e.g., "v1.0.0" or "latest")'
    required: false
    default: 'latest'
  repository:
    description: 'Repository to download cockpitctl from (e.g., "EffortlessMetrics/cockpitctl"). Defaults to the action repository.'
    required: false
    default: ''
  post-comment:
    description: 'Whether to post/update the PR comment (requires GITHUB_TOKEN with PR write access)'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for posting PR comments (defaults to GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}
  fail-on-error:
    description: 'Fail the action if cockpitctl returns a non-zero exit code'
    required: false
    default: 'true'
  schema-validation:
    description: 'Schema validation mode for sensor receipts ("lax" or "strict")'
    required: false
    default: ''
  github-annotations:
    description: 'Emit GitHub Actions workflow annotations (::error, ::warning, ::notice)'
    required: false
    default: 'true'
  toolpack:
    description: 'Path to toolpack.json for manifest-based installation'
    required: false
    default: ''

outputs:
  exit-code:
    description: 'Exit code from cockpitctl (0=pass, 2=policy fail, 1=runtime error)'
    value: ${{ steps.ingest.outputs.exit-code }}
  verdict:
    description: 'Overall verdict (pass, warn, fail, skip)'
    value: ${{ steps.ingest.outputs.verdict }}
  report-path:
    description: 'Path to the generated report.json'
    value: ${{ steps.ingest.outputs.report-path }}
  comment-path:
    description: 'Path to the generated comment.md'
    value: ${{ steps.ingest.outputs.comment-path }}

runs:
  using: 'composite'
  steps:
    - name: Detect platform
      id: platform
      shell: bash
      run: |
        case "${{ runner.os }}" in
          Linux)
            echo "asset=cockpitctl-linux-x64" >> $GITHUB_OUTPUT
            echo "platform=linux-x64" >> $GITHUB_OUTPUT
            echo "binary=cockpitctl" >> $GITHUB_OUTPUT
            ;;
          macOS)
            if [[ "${{ runner.arch }}" == "ARM64" ]]; then
              echo "asset=cockpitctl-darwin-arm64" >> $GITHUB_OUTPUT
              echo "platform=darwin-arm64" >> $GITHUB_OUTPUT
            else
              echo "asset=cockpitctl-darwin-x64" >> $GITHUB_OUTPUT
              echo "platform=darwin-x64" >> $GITHUB_OUTPUT
            fi
            echo "binary=cockpitctl" >> $GITHUB_OUTPUT
            ;;
          Windows)
            echo "asset=cockpitctl-windows-x64.exe" >> $GITHUB_OUTPUT
            echo "platform=windows-x64" >> $GITHUB_OUTPUT
            echo "binary=cockpitctl.exe" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "::error::Unsupported platform: ${{ runner.os }}"
            exit 1
            ;;
        esac

    - name: Determine download URL
      id: url
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repository }}
        INPUT_VERSION: ${{ inputs.version }}
        FALLBACK_REPO: ${{ github.action_repository }}
      run: |
        REPO="$INPUT_REPO"
        if [[ -z "$REPO" ]]; then
          REPO="$FALLBACK_REPO"
        fi

        if [[ -z "$REPO" ]]; then
          echo "::error::Unable to determine repository for downloads. Set inputs.repository (e.g. EffortlessMetrics/cockpitctl)."
          exit 1
        fi

        VERSION="$INPUT_VERSION"
        ASSET="${{ steps.platform.outputs.asset }}"

        if [[ "$VERSION" == "latest" ]]; then
          URL="https://github.com/${REPO}/releases/latest/download/${ASSET}"
        else
          # Ensure version starts with 'v'
          if [[ "$VERSION" != v* ]]; then
            VERSION="v${VERSION}"
          fi
          URL="https://github.com/${REPO}/releases/download/${VERSION}/${ASSET}"
        fi

        echo "url=${URL}" >> $GITHUB_OUTPUT

    - name: Download cockpitctl (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        curl -fsSL "${{ steps.url.outputs.url }}" -o /tmp/cockpitctl
        chmod +x /tmp/cockpitctl
        echo "/tmp" >> $GITHUB_PATH

    - name: Download cockpitctl (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $url = "${{ steps.url.outputs.url }}"
        $dest = "$env:RUNNER_TEMP\cockpitctl.exe"
        Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
        "$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Download SHA256SUMS.txt from release
      id: sha256sums
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repository }}
        INPUT_VERSION: ${{ inputs.version }}
        FALLBACK_REPO: ${{ github.action_repository }}
      run: |
        PY=python3
        command -v python3 >/dev/null 2>&1 || PY=python

        REPO="$INPUT_REPO"
        if [[ -z "$REPO" ]]; then
          REPO="$FALLBACK_REPO"
        fi

        VERSION="$INPUT_VERSION"
        if [[ "$VERSION" == "latest" ]]; then
          LATEST_URL="https://api.github.com/repos/${REPO}/releases/latest"
          VERSION=$(curl -fsSL "$LATEST_URL" | $PY -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
        elif [[ "$VERSION" != v* ]]; then
          VERSION="v${VERSION}"
        fi

        SHA256_URL="https://github.com/${REPO}/releases/download/${VERSION}/SHA256SUMS.txt"

        # Try to download SHA256SUMS.txt
        if curl -fsSL "$SHA256_URL" -o /tmp/SHA256SUMS.txt; then
          echo "sha256sums-available=true" >> $GITHUB_OUTPUT
          echo "::notice::Downloaded SHA256SUMS.txt from $SHA256_URL"
        else
          echo "sha256sums-available=false" >> $GITHUB_OUTPUT
          echo "::warning::Could not download SHA256SUMS.txt from $SHA256_URL"
        fi

    - name: Extract checksum from SHA256SUMS.txt
      id: release_checksum
      shell: bash
      run: |
        ASSET="${{ steps.platform.outputs.asset }}"
        EXPECTED_HASH=""

        if [[ "${{ steps.sha256sums.outputs.sha256sums-available }}" == "true" ]]; then
          # Extract SHA256 for the current asset from SHA256SUMS.txt
          EXPECTED_HASH=$(grep -F "  ${ASSET}" /tmp/SHA256SUMS.txt | awk '{print $1}')

          if [[ -n "$EXPECTED_HASH" ]]; then
            echo "expected-hash=$EXPECTED_HASH" >> $GITHUB_OUTPUT
            echo "checksum-source=release" >> $GITHUB_OUTPUT
            echo "checksum-available=true" >> $GITHUB_OUTPUT
            echo "::notice::Expected SHA256 checksum from SHA256SUMS.txt: $EXPECTED_HASH"
          else
            echo "checksum-available=false" >> $GITHUB_OUTPUT
            echo "::warning::No SHA256 checksum found in SHA256SUMS.txt for asset '$ASSET'"
          fi
        else
          echo "checksum-available=false" >> $GITHUB_OUTPUT
        fi

    - name: Extract expected checksum from toolpack
      id: checksum
      shell: bash
      run: |
        PY=python3
        command -v python3 >/dev/null 2>&1 || PY=python

        TOOLPACK="${{ inputs.toolpack }}"
        PLATFORM="${{ steps.platform.outputs.platform }}"
        EXPECTED_HASH=""

        # Only check toolpack if release checksum was not available
        if [[ "${{ steps.release_checksum.outputs.checksum-available }}" != "true" ]] && [[ -n "$TOOLPACK" && -f "$TOOLPACK" ]]; then
          # Extract SHA256 for the current platform from toolpack.json
          EXPECTED_HASH=$($PY -c "
import sys, json
tp = json.load(open(sys.argv[1]))
print(tp.get('tools',{}).get('cockpitctl',{}).get('assets',{}).get(sys.argv[2],{}).get('sha256',''))
" "$TOOLPACK" "$PLATFORM" 2>/dev/null || echo "")

          if [[ -n "$EXPECTED_HASH" ]]; then
            echo "expected-hash=$EXPECTED_HASH" >> $GITHUB_OUTPUT
            echo "checksum-source=toolpack" >> $GITHUB_OUTPUT
            echo "checksum-available=true" >> $GITHUB_OUTPUT
            echo "::notice::Expected SHA256 checksum from toolpack.json: $EXPECTED_HASH"
          else
            echo "checksum-available=false" >> $GITHUB_OUTPUT
            echo "::warning::No SHA256 checksum found in toolpack.json for asset '$ASSET'"
          fi
        elif [[ "${{ steps.release_checksum.outputs.checksum-available }}" == "true" ]]; then
          # Release checksum is available, pass it through
          echo "expected-hash=${{ steps.release_checksum.outputs.expected-hash }}" >> $GITHUB_OUTPUT
          echo "checksum-source=${{ steps.release_checksum.outputs.checksum-source }}" >> $GITHUB_OUTPUT
          echo "checksum-available=true" >> $GITHUB_OUTPUT
        else
          echo "checksum-available=false" >> $GITHUB_OUTPUT
          if [[ -n "$TOOLPACK" ]]; then
            echo "::warning::Toolpack file not found: $TOOLPACK - checksum verification unavailable"
          else
            echo "::warning::No toolpack provided and no SHA256SUMS.txt available - checksum verification unavailable"
          fi
        fi

    - name: Compute checksum (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        ACTUAL_HASH=$(sha256sum /tmp/cockpitctl | awk '{print $1}')
        echo "ACTUAL_HASH=$ACTUAL_HASH" >> $GITHUB_ENV
        echo "::notice::Computed SHA256 checksum: $ACTUAL_HASH"

    - name: Compute checksum (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $hash = (Get-FileHash -Path "$env:RUNNER_TEMP\cockpitctl.exe" -Algorithm SHA256).Hash.ToLower()
        echo "ACTUAL_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "::notice::Computed SHA256 checksum: $hash"

    - name: Verify checksum
      shell: bash
      run: |
        if [[ "${{ steps.checksum.outputs.checksum-available }}" == "true" ]]; then
          EXPECTED="${{ steps.checksum.outputs.expected-hash }}"
          SOURCE="${{ steps.checksum.outputs.checksum-source }}"
          ACTUAL="$ACTUAL_HASH"

          if [[ "$ACTUAL" == "$EXPECTED" ]]; then
            echo "::notice::Checksum verification passed (verified against $SOURCE)"
          else
            echo "::error::Checksum verification failed!"
            echo "::error::Source: $SOURCE"
            echo "::error::Expected: $EXPECTED"
            echo "::error::Actual:   $ACTUAL"
            exit 1
          fi
        else
          echo "::warning::Checksum verification skipped - no expected hash available"
          echo "::warning::The downloaded binary has not been cryptographically verified"
        fi

    - name: Verify installation
      shell: bash
      run: |
        cockpitctl --version || ${{ steps.platform.outputs.binary }} --version

    - name: Run cockpitctl ingest
      id: ingest
      shell: bash
      run: |
        set +e

        # Build argv as an array (no eval; avoids injection and quoting bugs)
        CMD=(cockpitctl ingest
          --artifacts "${{ inputs.artifacts-path }}"
          --config "${{ inputs.config-path }}"
        )

        # Add schema-validation if provided
        if [[ -n "${{ inputs.schema-validation }}" ]]; then
          CMD+=(--schema-validation "${{ inputs.schema-validation }}")
        fi

        # Add github-annotations if enabled
        if [[ "${{ inputs.github-annotations }}" == "true" ]]; then
          CMD+=(--github-annotations)
        fi

        # Add labels if provided (inputs.labels is comma-separated)
        if [[ -n "${{ inputs.labels }}" ]]; then
          IFS=',' read -r -a LABELS <<< "${{ inputs.labels }}"
          for label in "${LABELS[@]}"; do
            # trim whitespace
            label="${label#"${label%%[![:space:]]*}"}"
            label="${label%"${label##*[![:space:]]}"}"
            [[ -n "$label" ]] || continue
            CMD+=(--label "$label")
          done
        fi

        echo "Running: ${CMD[*]}"
        "${CMD[@]}"
        EXIT_CODE=$?

        echo "exit-code=${EXIT_CODE}" >> $GITHUB_OUTPUT

        # Determine verdict from exit code
        case $EXIT_CODE in
          0)
            echo "verdict=pass" >> $GITHUB_OUTPUT
            ;;
          2)
            echo "verdict=fail" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "verdict=error" >> $GITHUB_OUTPUT
            ;;
        esac

        # Set output paths
        echo "report-path=${{ inputs.artifacts-path }}/cockpit/report.json" >> $GITHUB_OUTPUT
        echo "comment-path=${{ inputs.artifacts-path }}/cockpit/comment.md" >> $GITHUB_OUTPUT

        # Store exit code for later
        echo "COCKPITCTL_EXIT_CODE=${EXIT_CODE}" >> $GITHUB_ENV

    - name: Post PR comment
      if: inputs.post-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        COMMENT_FILE="${{ inputs.artifacts-path }}/cockpit/comment.md"

        if [[ ! -f "$COMMENT_FILE" ]]; then
          echo "::warning::Comment file not found at ${COMMENT_FILE}, skipping PR comment"
          exit 0
        fi

        PR_NUMBER="${{ github.event.pull_request.number }}"

        # Try to update existing comment, fall back to creating new one
        gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE" --edit-last 2>/dev/null || \
          gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE"

    - name: Check result
      if: inputs.fail-on-error == 'true'
      shell: bash
      run: |
        if [[ "$COCKPITCTL_EXIT_CODE" != "0" ]]; then
          echo "::error::cockpitctl exited with code ${COCKPITCTL_EXIT_CODE}"
          exit $COCKPITCTL_EXIT_CODE
        fi