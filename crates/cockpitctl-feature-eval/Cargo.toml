[package]
name = "cockpitctl-feature-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Feature-toggle runtime evaluation and BDD state token parsing helpers."
readme = "README.md"
keywords = ["ci", "feature-flags", "bdd", "interop", "ingest"]
categories = ["development-tools"]

[dependencies]
cockpitctl-feature-state = { path = "../cockpitctl-feature-state", version = "0.3.0", default-features = false }

[features]
default = ["feature-hooks", "feature-buildfix", "feature-policy-signing"]
feature-hooks = ["cockpitctl-feature-state/feature-hooks"]
feature-buildfix = ["cockpitctl-feature-state/feature-buildfix"]
feature-policy-signing = ["cockpitctl-feature-state/feature-policy-signing"]
