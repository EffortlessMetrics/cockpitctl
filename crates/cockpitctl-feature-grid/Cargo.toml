[package]
name = "cockpitctl-feature-grid"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Shared BDD feature-toggle grid and runtime state helpers."
readme = "README.md"
keywords = ["ci", "feature-flags", "bdd", "interop", "ingest"]
categories = ["development-tools"]

[dependencies]
cockpitctl-feature-eval = { path = "../cockpitctl-feature-eval", version = "0.3.0", default-features = false }
cockpitctl-feature-state = { path = "../cockpitctl-feature-state", version = "0.3.0", default-features = false }

[dev-dependencies]
insta.workspace = true

[features]
default = ["feature-hooks", "feature-buildfix", "feature-policy-signing"]
feature-hooks = ["cockpitctl-feature-state/feature-hooks", "cockpitctl-feature-eval/feature-hooks"]
feature-buildfix = ["cockpitctl-feature-state/feature-buildfix", "cockpitctl-feature-eval/feature-buildfix"]
feature-policy-signing = ["cockpitctl-feature-state/feature-policy-signing", "cockpitctl-feature-eval/feature-policy-signing"]
