[package]
name = "conformctl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Standalone conformance checker for cockpitctl sensor receipts"
keywords = ["ci", "cd", "sensors", "conformance"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "conformctl"
path = "src/main.rs"

[dependencies]
cockpitctl-conform = { path = "../cockpitctl-conform", version = "0.1.0" }
cockpitctl-types = { path = "../cockpitctl-types", version = "0.1.0" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
