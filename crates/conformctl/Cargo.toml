[package]
name = "conformctl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
description = "CLI for conformance checking cockpitctl receipts and aggregated cockpit reports."
keywords = ["ci", "conformance", "cli", "schema", "validation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "conformctl"
path = "src/main.rs"

[dependencies]
cockpitctl-conform = { path = "../cockpitctl-conform", version = "0.3.0" }
cockpitctl-types = { path = "../cockpitctl-types", version = "0.3.0" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
