[package]
name = "cockpitctl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Facade crate that re-exports cockpitctl microcrates as one dependency."
readme = "README.md"
keywords = ["ci", "cockpit", "facade", "receipts", "policy"]
categories = ["development-tools"]
exclude = ["tests/"]

[dependencies]
cockpitctl-types = { path = "../cockpitctl-types", version = "0.3.0" }
cockpitctl-domain = { path = "../cockpitctl-domain", version = "0.3.0" }
cockpitctl-ingest = { path = "../cockpitctl-ingest", version = "0.3.0" }
cockpitctl-ingest-buildfix = { path = "../cockpitctl-ingest-buildfix", version = "0.3.0" }
cockpitctl-render = { path = "../cockpitctl-render", version = "0.3.0" }
cockpitctl-io = { path = "../cockpitctl-io", version = "0.3.0" }
cockpitctl-io-buildfix = { path = "../cockpitctl-io-buildfix", version = "0.3.0" }
cockpitctl-io-hooks = { path = "../cockpitctl-io-hooks", version = "0.3.0" }
cockpitctl-io-policy-signing = { path = "../cockpitctl-io-policy-signing", version = "0.3.0" }
cockpitctl-io-schema = { path = "../cockpitctl-io-schema", version = "0.3.0" }
cockpitctl-feature-state = { path = "../cockpitctl-feature-state", version = "0.3.0" }
cockpitctl-feature-grid = { path = "../cockpitctl-feature-grid", version = "0.3.0" }
cockpitctl-sarif = { path = "../cockpitctl-sarif", version = "0.3.0" }
cockpitctl-domain-buildfix = { path = "../cockpitctl-domain-buildfix", version = "0.3.0" }
cockpitctl-domain-signing = { path = "../cockpitctl-domain-signing", version = "0.3.0" }
cockpitctl-domain-trend = { path = "../cockpitctl-domain-trend", version = "0.3.0" }

[dev-dependencies]
anyhow.workspace = true
cockpitctl-conform = { path = "../cockpitctl-conform", version = "0.3.0" }
jsonschema.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
