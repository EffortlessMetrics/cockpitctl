[package]
name = "cockpitctl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Director CLI that ingests CI sensor receipts and emits deterministic merge evidence."
readme.workspace = true
keywords = ["ci", "cd", "cli", "sensors", "merge-decisions"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "cockpitctl"
path = "src/lib.rs"

[[bin]]
name = "cockpitctl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
toml.workspace = true
time.workspace = true
cockpitctl-core = { path = "../cockpitctl-core", version = "0.2.1" }
cockpitctl-types = { path = "../cockpitctl-types", version = "0.2.1" }
cockpitctl-domain = { path = "../cockpitctl-domain", version = "0.2.1" }
cockpitctl-ingest = { path = "../cockpitctl-ingest", version = "0.2.1" }
cockpitctl-render = { path = "../cockpitctl-render", version = "0.2.1" }
cockpitctl-io = { path = "../cockpitctl-io", version = "0.2.1" }
cockpitctl-sarif = { path = "../cockpitctl-sarif", version = "0.2.1" }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
pretty_assertions.workspace = true
serde_json.workspace = true
tempfile.workspace = true
cucumber.workspace = true
futures.workspace = true
toml.workspace = true

[[test]]
name = "bdd"
harness = false
